# Baseline PPO Configuration
# Standard PPO fine-tuning without balanced reward

# Environment Parameters
env_params:
  time_step: 0.01
  max_episode_steps: 1000
  target_velocity: 0.5
  reward_type: "speed"  # Simple speed-based reward (baseline)

# Training Parameters
n_envs: 4
normalize: true
total_timesteps: 1000000

# PPO Hyperparameters (standard settings)
ppo_params:
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: false
  sde_sample_freq: -1
  target_kl: null
  verbose: 1
  
  policy_kwargs:
    net_arch:
      - 256
      - 256
    activation_fn: "relu"

# Evaluation
eval_freq: 10000
n_eval_episodes: 10

# Checkpointing
checkpoint_freq: 50000

# Logging
log_interval: 10
render: false
