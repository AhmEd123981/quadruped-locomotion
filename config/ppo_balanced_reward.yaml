# PPO Configuration with Balanced Reward Function
# This configuration implements the proposed reward balancing approach

# Environment Parameters
env_params:
  time_step: 0.01
  max_episode_steps: 1000
  target_velocity: 0.5
  reward_type: "balanced"  # Use balanced reward function
  speed_weight: 0.6  # Weight for speed optimization
  gait_weight: 0.4   # Weight for gait preservation

# Training Parameters
n_envs: 4  # Number of parallel environments
normalize: true  # Normalize observations and rewards
total_timesteps: 1000000  # Total training timesteps

# PPO Hyperparameters
ppo_params:
  learning_rate: 3.0e-4
  n_steps: 2048  # Steps per environment per update
  batch_size: 64
  n_epochs: 10  # Number of epochs per update
  gamma: 0.99  # Discount factor
  gae_lambda: 0.95  # GAE parameter
  clip_range: 0.2  # PPO clip parameter
  clip_range_vf: null  # Optional value function clip
  ent_coef: 0.01  # Entropy coefficient for exploration
  vf_coef: 0.5  # Value function coefficient
  max_grad_norm: 0.5  # Gradient clipping
  use_sde: false  # State-dependent exploration
  sde_sample_freq: -1
  target_kl: null  # Target KL divergence (optional)
  verbose: 1
  
  # Policy Network Architecture
  policy_kwargs:
    net_arch: 
      - 256
      - 256
    activation_fn: "relu"

# Evaluation Parameters
eval_freq: 10000  # Evaluate every N steps
n_eval_episodes: 10  # Episodes per evaluation

# Checkpointing
checkpoint_freq: 50000  # Save checkpoint every N steps

# Logging
log_interval: 10  # Log every N updates
render: false  # Render during training (slow)

# Reward Function Specific Parameters
reward_config:
  # Speed component
  speed_weight: 0.6
  speed_error_scale: 2.0  # Exponential scaling for speed error
  
  # Gait stability component
  gait_weight: 0.4
  orientation_stability_scale: 5.0
  height_stability_scale: 10.0
  target_height: 0.3
  
  # Energy efficiency
  action_magnitude_penalty: 0.01
  action_smoothness_penalty: 0.005
  
  # Gait preservation (if BC reference available)
  gait_preservation_weight: 0.1
  gait_deviation_scale: 1.0
  
  # Fall penalties
  fall_penalty: -10.0
  min_height_threshold: 0.15
  max_tilt_threshold: 1.047  # pi/3 radians (~60 degrees)
