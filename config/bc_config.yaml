# Behavior Cloning (BC) Configuration
# Stage 1: Pre-training from expert demonstrations

# Environment Parameters
env_params:
  time_step: 0.01
  max_episode_steps: 1000
  target_velocity: 0.4  # Conservative velocity for stable gait
  reward_type: "stability"  # Focus on stable locomotion
#  render: false

# BC Training Parameters
bc_params:
  learning_rate: 1.0e-3
  optimizer: "adam"
  
  # Policy Network Architecture
  policy_kwargs:
    net_arch:
      - 256
      - 256
#    activation_fn: "relu"
    
# Training Configuration
n_epochs: 100  # Number of training epochs
batch_size: 64  # Batch size for BC training

# Data Configuration
data_config:
  shuffle: true
  validation_split: 0.1  # 10% for validation
  augmentation: false  # Data augmentation (optional)

# Evaluation Parameters
eval_freq: 5000  # Evaluate every N training steps
n_eval_episodes: 10

# Checkpointing
checkpoint_freq: 10000  # Save checkpoint every N training steps

# Logging
log_interval: 10  # Log every N batches
verbose: 1

# Early Stopping (optional)
early_stopping:
  enabled: true
  patience: 10  # Stop if no improvement for N evaluations
  min_delta: 0.01  # Minimum improvement threshold
